[project]
name = "shelp"
version = "0.2.0"
description = "`cmd??` — instant, man-page-grounded cheat sheets for shell commands, expandable into an agentic chat"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openai>=3.19.2",
    "rich>=13.0",
]

[project.scripts]
shelp = "shelp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
