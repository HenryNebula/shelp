[project]
name = "shelp-llm"
dynamic = ["version"]
description = "`cmd??` — instant, man-page-grounded cheat sheets for shell commands, expandable into an agentic chat"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["cli", "cheatsheet", "man", "llm", "shell"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openai>=3.19.2",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/HenryNebula/shelp"
Repository = "https://github.com/HenryNebula/shelp"
Changelog = "https://github.com/HenryNebula/shelp/releases"

[project.scripts]
shelp = "shelp.cli:main"

[dependency-groups]
dev = [
    "pyte>=0.8.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelp"]

[tool.hatch.version]
path = "src/shelp/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests driving the real CLI (or a real shell) on a pty",
]
